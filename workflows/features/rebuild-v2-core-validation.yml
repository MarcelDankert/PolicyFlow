workflow:
  id: policyflow-v2-core-validation
  type: feature

context:
  workflow_file: workflows/features/rebuild-v2-core-validation.yml
  risk_level: HIGH
  confidence:
    planning: Issue #145 defines the V2 governance-result slice after #144 introduced the V2 schema.
    implementation: Scope is additive V2 validation results and merge-readiness rules without V1 cutover.
    tests: Focused V2 result tests and the full suite will cover PASS, WARN, BLOCK, evidence, approval, and overrides.
    residual_uncertainty: CLI and public API cutover remain owned by later issues.

governance:
  required_reviews:
    - architecture-agent
    - review-agent
    - qa-agent
  human_approval_required: true
  escalation_required: true
  protected_areas_touched:
    - schema behavior
    - validator behavior
  approval_evidence:
    - evidence.approval

execution:
  mode: strict
  phases:
    - phase: planning
      state: completed
    - phase: architecture-check
      state: completed
    - phase: implementation
      state: completed
    - phase: review
      state: completed
    - phase: qa
      state: completed
    - phase: approval
      state: completed

evidence:
  planning:
    summary: Issue #145 was selected after #144 merged and branch codex/policyflow-v2-core-validation was created from origin/main.
    scope_locked:
      - Add V2 PASS/WARN/BLOCK result semantics.
      - Add V2 evidence, approval, override, and merge-readiness rules.
      - Document the JSON validation result shape.
    non_goals_locked:
      - No test execution.
      - No metric calculation.
      - No loop execution.
      - No GitHub mutation.
      - No runtime state mutation.
      - No public API or CLI cutover.
    risk_rationale: HIGH because validator semantics define governance decisions for the V2 cutover path.
  architecture-check:
    decision: Add a V2 rules module and validator result entry points beside V1 behavior.
    constraints:
      - Do not use runtime, active agent, runner, handoff, loop iteration, or metric-calculation fields for V2 merge readiness.
      - Keep execution systems external; only validate declared normalized evidence.
      - Preserve existing V1 validator behavior.
    approval_path: ADR-0004 and Issue #145.
  approval:
    approved_by: MarcelDankert
    reference: https://github.com/MarcelDankert/PolicyFlow/issues/145
    scope_confirmed: true
  review:
    outcome: approved
    findings_summary: Review pending in PR; local implementation has no known findings.
    residual_risk: V2 result semantics should be reviewed because later CLI/API cutover will depend on them.
  qa:
    outcome: passed
    evidence_summary: pytest -q tests/test_validator.py, workflow validation, and pytest -q passed locally.
    unresolved_risks: []

contracts:
  planning:
    owner_agent: planning-agent
    issue_brief: Rebuild core validation around Policy, Evidence, and Merge Readiness.
    acceptance_criteria:
      - Valid V2 changes return PASS when governance is satisfied.
      - Missing required evidence returns BLOCK.
      - Human approval can block or warn according to allow_pending behavior.
      - Expiring overrides return WARN and expired overrides return BLOCK.
      - Merge readiness is computed without runtime, runner, handoff, loop, or metric state.
    approved_scope:
      - policyflow/models.py
      - policyflow/rules.py
      - policyflow/validator.py
      - policyflow/reporting.py
      - tests/test_validator.py
      - tests/fixtures/
      - docs/schema-compatibility.md
    non_goals:
      - No test execution.
      - No metric calculation.
      - No loop execution.
      - No GitHub mutation.
      - No runtime state mutation.
      - No CLI or public API cutover.
    initial_risk_level: HIGH
    protected_areas_touched:
      - schema behavior
      - validator behavior
    confidence_summary: "#144 gives the V2 schema target; this issue adds additive governance-result semantics."
    escalation_flags:
      - Validator semantics
  architecture-check:
    owner_agent: architecture-agent
    architecture_assessment: A separate V2 rules module keeps governance decision logic isolated from V1 phase orchestration checks.
    approved_scope:
      - V2 validation result model
      - V2 evidence and override checks
      - V2 merge-readiness rules
      - JSON result documentation
    module_boundaries:
      - models owns typed documents and result payloads.
      - rules owns V2 governance decision rules.
      - validator owns parsing and result entry points.
      - reporting may expose read-only result serialization helpers if needed.
    contract_impact: Adds additive V2 target behavior without removing V1 validation behavior.
    risk_review_decision: HIGH risk accepted because validation semantics are protected governance behavior.
    required_reviews:
      - architecture-agent
      - review-agent
      - qa-agent
    implementation_constraints:
      - Do not reintroduce execution ownership.
      - Do not calculate metrics or run checks.
      - Do not mutate GitHub or runtime state.
  implementation:
    owner_agent: senior-dev-agent
    implementation_summary: Added V2 validation result models, governance decision rules, result validator entry points, fixtures, tests, and documentation.
    changed_files:
      - policyflow/models.py
      - policyflow/rules.py
      - policyflow/validator.py
      - tests/test_validator.py
      - tests/fixtures/v2-missing-required-evidence.yml
      - tests/fixtures/v2-pending-human-approval.yml
      - tests/fixtures/v2-expiring-override.yml
      - tests/fixtures/v2-expired-override.yml
      - docs/schema-compatibility.md
      - policyflow/assets/docs/schema-compatibility.md
      - workflows/features/rebuild-v2-core-validation.yml
    test_summary: pytest -q tests/test_validator.py, workflow validation, and pytest -q passed locally.
    docs_updates:
      - docs/schema-compatibility.md
      - policyflow/assets/docs/schema-compatibility.md
    known_limitations:
      - CLI and public API cutover remain for later issues.
      - V1 validator behavior remains in place.
    unresolved_questions: []
  review:
    owner_agent: review-agent
    review_findings: []
    required_fixes: []
    severity: none
    approval_status: pending-pr-review
    review_approval: pending-pr-review
    residual_risk: Result semantics are additive but need PR review before merge.
    qa_focus_areas:
      - PASS/WARN/BLOCK behavior
      - evidence requirements
      - override lifecycle
      - merge readiness without runtime state
    test_expectations:
      - pytest -q tests/test_validator.py
      - python -m policyflow.cli validate workflows/features/rebuild-v2-core-validation.yml
      - pytest -q
  qa:
    owner_agent: qa-agent
    qa_report: Focused validator tests, active workflow validation, and full suite passed locally.
    quality_gate_status: passed
    unresolved_risks: []
    approval_required: true
    merge_readiness: true

overrides: []
